name: Android verification
on:
  push:
    paths-ignore: ['site/**', '.github/workflows/pages.yml', 'docs/WEBSITE.md']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/pages.yml', 'docs/WEBSITE.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Verify wrapper
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256
      - name: Build, unit tests, lint and unsigned release
        run: ./gradlew :core:test :app:lint :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :fixture:assembleDebug --console=plain
      - name: Audit release manifest and localizations
        run: python3 tools/release-check.py
      - name: Checksums
        run: sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk fixture/build/outputs/apk/debug/*.apk > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-builds
          path: |
            app/build/outputs/apk/
            fixture/build/outputs/apk/debug/
            core/build/reports/tests/
            app/build/reports/lint-results*
            SHA256SUMS
            LICENSE
            LICENSE-APACHE
            NOTICE
            THIRD_PARTY_NOTICES.md
            docs/dependency-inventory.json
  emulator:
    name: emulator (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :fixture:installDebug :app:installDebug :app:assembleDebugAndroidTest --console=plain
            adb shell settings put secure show_ime_with_hard_keyboard 1
            if [ "${{ matrix.api }}" -ge 33 ]; then adb shell pm grant dev.magicphone.app android.permission.POST_NOTIFICATIONS; fi
            ./gradlew :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-test-report-api-${{ matrix.api }}
          path: app/build/reports/androidTests/
